{% extends 'base.html' %}
{% block title %}Entrar — Pizzaria Jablonsk{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">

      <!-- Card de login -->
      <div class="card" style="border-radius:var(--r-xl) !important;">
        <div class="card-body p-4 p-sm-5">

          <!-- Logo -->
          <div class="text-center mb-4">
            <div style="font-family:var(--font-display);font-size:1.6rem;font-weight:900;color:var(--text);line-height:1;">
              <i class="bi bi-fire text-orange"></i> Jablonsk
            </div>
            <div style="font-size:.82rem;color:var(--text-3);margin-top:.4rem;">Entre na sua conta</div>
          </div>

          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" name="email" class="form-control" required autofocus
                     placeholder="seu@email.com">
            </div>
            <div class="mb-4">
              <label class="form-label">Senha</label>
              <input type="password" name="senha" class="form-control" required
                     placeholder="••••••">
            </div>
            <button class="btn btn-orange w-100 rounded-pill fw-semibold py-2">
              Entrar
            </button>
          </form>

          <div style="border-top:1px solid var(--border);margin:1.5rem 0;"></div>

          <p class="text-center mb-0" style="font-size:.85rem;color:var(--text-3);">
            Não tem conta?
            <a href="{{ url_for('auth.cadastro') }}"
               class="text-orange text-decoration-none fw-semibold">Criar conta</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
