<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Pizzaria Jablonsk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background:#0f172a">
<div class="col-sm-10 col-md-5 col-lg-4">
  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
  <div class="alert alert-{{ cat }} mb-3">{{ msg }}</div>
  {% endfor %}
  {% endwith %}
  <div class="card border-0 shadow-lg">
    <div class="card-body p-4">
      <h4 class="fw-bold text-center mb-1"><i class="bi bi-fire text-orange"></i> Admin</h4>
      <p class="text-muted text-center small mb-4">Painel Jablonsk</p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label small fw-medium">E-mail</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-medium">Senha</label>
          <input type="password" name="senha" class="form-control" required>
        </div>
        <button class="btn btn-orange w-100 rounded-pill fw-semibold">Entrar</button>
      </form>
    </div>
  </div>
  <p class="text-center text-muted small mt-3">
    <a href="{{ url_for('cardapio.index') }}" class="text-muted">← Voltar ao site</a>
  </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
