{% extends 'base.html' %}
{% block title %}Avaliar Pedido — Pizzaria Jablonsk{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 text-center">
          <i class="bi bi-star-fill text-orange fs-1"></i>
          <h4 class="fw-bold mt-2">Como foi o Pedido #{{ pedido.id }}?</h4>
          <p class="text-muted small">Sua avaliação ajuda a melhorar nosso serviço</p>

          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- Star rating -->
            <div class="star-rating my-3" id="star-container">
              {% for i in range(1,6) %}
              <i class="bi bi-star star-icon fs-2 mx-1" data-val="{{ i }}"></i>
              {% endfor %}
            </div>
            <input type="hidden" name="nota" id="nota-input" required>

            <div class="mb-4 mt-3 text-start">
              <label class="form-label small fw-medium">Comentário <span class="text-muted">(opcional)</span></label>
              <textarea name="comentario" class="form-control" rows="3"
                        placeholder="O que achou da pizza e da entrega?"></textarea>
            </div>
            <button type="submit" class="btn btn-orange w-100 rounded-pill fw-semibold"
                    id="btn-enviar" disabled>
              Enviar Avaliação
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const stars = document.querySelectorAll('.star-icon');
  const input = document.getElementById('nota-input');
  const btn   = document.getElementById('btn-enviar');
  stars.forEach(s => {
    s.addEventListener('click', () => {
      const val = +s.dataset.val;
      input.value = val;
      btn.disabled = false;
      stars.forEach(x => {
        x.className = +x.dataset.val <= val
          ? 'bi bi-star-fill star-icon fs-2 mx-1 text-orange'
          : 'bi bi-star star-icon fs-2 mx-1 text-muted';
      });
    });
    s.addEventListener('mouseenter', () => {
      const val = +s.dataset.val;
      stars.forEach(x => {
        x.className = +x.dataset.val <= val
          ? 'bi bi-star-fill star-icon fs-2 mx-1 text-orange'
          : 'bi bi-star star-icon fs-2 mx-1 text-muted';
      });
    });
    s.addEventListener('mouseleave', () => {
      const cur = +input.value;
      stars.forEach(x => {
        x.className = +x.dataset.val <= cur
          ? 'bi bi-star-fill star-icon fs-2 mx-1 text-orange'
          : 'bi bi-star star-icon fs-2 mx-1 text-muted';
      });
    });
  });
</script>
{% endblock %}
